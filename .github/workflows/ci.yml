name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexo
          POSTGRES_PASSWORD: nexo_ci_only
          POSTGRES_DB: nexotalent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexo" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run test:hooks
      - name: Integración (PostgreSQL + pgvector)
        run: npm run test:int
        env:
          TEST_DATABASE_URL: postgres://nexo:nexo_ci_only@localhost:5432/nexotalent_test
      - run: npm run build

  # Pruebas funcionales en vivo + E2E en navegador contra la app levantada (API en memoria + Vite).
  functional:
    runs-on: ubuntu-latest
    needs: test
    env:
      JWT_SECRET: ci-only-secret-ci-only-secret-0123456789
      STORAGE: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Levantar API y web
        run: |
          npm run dev:api > api.log 2>&1 &
          npm run dev:web > web.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:5173/health && break; sleep 2; done
      - run: npm run test:functional
      - run: npm run test:e2e
        env:
          PW_CHANNEL: chromium
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            api.log
            web.log
